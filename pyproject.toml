[project]
name = "viral-clipper"
version = "0.1.0"
description = "Estrae automaticamente le clip più virali da video lunghi"
requires-python = ">=3.11"

[project.scripts]
viral-clipper = "viral_clipper.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
